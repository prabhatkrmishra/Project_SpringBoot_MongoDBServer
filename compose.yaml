services:
  mongo:
    image: mongo:8
    container_name: mongodbserver-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:9812:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-root}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "-u", "${MONGODB_ROOT_USERNAME:-root}", "-p", "${MONGODB_ROOT_PASSWORD:-root}", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: mongodbserver-mongo-express
    restart: unless-stopped
    ports:
      # Loopback only: the UI is reachable through the admin app proxy at /mongo-express
      - "127.0.0.1:9813:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-root}:${MONGODB_ROOT_PASSWORD:-root}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
      ME_CONFIG_SITE_BASEURL: /mongo-express
    depends_on:
      - mongo

  restheart:
    image: softinstigate/restheart:9.6.0
    container_name: mongodbserver-restheart
    restart: unless-stopped
    ports:
      - "9814:9814"
    user: root
    env_file: .env
    environment:
      # Inside the Docker network, mongo resolves to the mongo service name.
      RHO: >-
        /mclient/connection-string->"mongodb://${MONGODB_ROOT_USERNAME:-root}:${MONGODB_ROOT_PASSWORD:-root}@mongo:27017/?authSource=admin";
        /http-listener/host->"0.0.0.0";
        /http-listener/port->9814;
        /authenticator/class->"org.restheart.security.impl.MongoDBRealmAuthenticator";
        /authenticator/enabled->true;
        /idm/class->"org.restheart.security.impl.MongoIDRepository";
        /idm/enabled->true;
        /authorizer/enabled->true;
        /authorizer/class->"org.restheart.security.impl.MongoAuthorizer"
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9814/ping')\" || python -c \"import urllib2; urllib2.urlopen('http://localhost:9814/ping')\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
