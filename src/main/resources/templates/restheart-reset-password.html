<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('Reset RESTHeart Password')}"></head>
<body>
    <div class="layout">
        <aside th:replace="~{fragments/nav :: nav('restheart-users')}"></aside>

        <div class="main">
            <div th:replace="~{fragments/nav :: flash}"></div>

            <main class="container-xxl py-4">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a class="link-primary" th:href="@{/}">Dashboard</a></li>
                        <li class="breadcrumb-item"><a class="link-primary" th:href="@{/restheart/users}">RESTHeart
                            Users</a></li>
                        <li class="breadcrumb-item active" th:text="'Reset ' + ${user['_id']}">user</li>
                    </ol>
                </nav>

                <section class="card shadow-sm mb-4" style="max-width: 560px;">
                    <div class="card-header bg-transparent">
                        <h2 class="h5 mb-0">
                            <i class="bi bi-key text-primary me-2"></i> Reset password for
                            <span th:text="${user['_id']}">user</span>
                        </h2>
                    </div>
                    <div class="card-body">
                        <p class="text-body-secondary mb-4">
                            The old password stops working immediately. The new password is bcrypt-hashed and shown only
                            on this page.
                        </p>
                        <form method="post"
                              th:action="@{/restheart/users/{id}/reset(id=${user['_id']})}"
                              th:object="${resetForm}">
                            <div class="mb-3">
                                <label class="form-label" for="newPassword">New password</label>
                                <div class="input-group">
                                    <input autocomplete="new-password" class="form-control" id="newPassword"
                                           maxlength="128" required th:field="*{password}"
                                           type="password" placeholder="Minimum 8 characters">
                                    <button class="btn btn-outline-secondary" data-toggle-password="newPassword"
                                            type="button">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="form-hint">Minimum 8 characters. Stored as bcrypt hash.</div>
                                <div class="text-danger small mt-1" th:errors="*{password}"
                                     th:if="${#fields.hasErrors('password')}">Error
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-check-lg me-1"></i> Reset password
                                </button>
                                <a class="btn btn-outline-secondary" th:href="@{/restheart/users}">
                                    <i class="bi bi-arrow-left me-1"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
