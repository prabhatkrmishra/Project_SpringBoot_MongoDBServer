<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('Activity')}"></head>
<body>
    <div class="layout">
        <aside th:replace="~{fragments/nav :: nav('activity')}"></aside>

        <div class="main">
            <main th:replace="~{fragments/nav :: flash}"></main>

            <main class="container-xxl py-4">
                <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <h1 class="mb-1">Admin activity</h1>
                        <p class="mb-0">
                            <span th:text="${totalCount}">0</span> recorded action(s) —
                            page <span th:text="${page}">1</span> of <span th:text="${totalPages}">1</span>
                        </p>
                    </div>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/}">
                        <i class="bi bi-arrow-left"></i> Dashboard
                    </a>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="empty-state" th:if="${#lists.isEmpty(events)}">
                            <span class="empty-state-icon"><i class="bi bi-clock-history"></i></span>
                            <p class="empty-state-title">No admin activity yet</p>
                            <p class="empty-state-text">Provisioning, resets, and deletions will appear here.</p>
                        </div>
                        <div class="table-responsive" th:if="${!#lists.isEmpty(events)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Action</th>
                                        <th>Database</th>
                                        <th>User</th>
                                        <th>By</th>
                                        <th>When</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="event : ${events}">
                                        <td>
                                    <span th:class="${event.eventType == 'DELETE'} ? 'badge badge-soft-danger'
                                        : (${event.eventType == 'PROVISION'} ? 'badge badge-soft-success' : 'badge badge-soft-info')"
                                          th:text="${#strings.replace(event.eventType, '_', ' ')}">PROVISION</span>
                                        </td>
                                        <td th:text="${event.dbName}">myapp</td>
                                        <td th:text="${event.userName} ?: '—'">appuser</td>
                                        <td th:text="${event.performedBy}">admin</td>
                                        <td class="text-body-secondary" th:text="${event.performedAt}">-</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center"
                         th:if="${!#lists.isEmpty(events)}">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/activity(page=${page - 1})}"
                           th:if="${hasPrev}">
                            <i class="bi bi-chevron-left"></i> Previous
                        </a>
                        <span class="text-body-secondary small" th:text="'Page ' + ${page} + ' of ' + ${totalPages}">Page 1 of 1</span>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/activity(page=${page + 1})}"
                           th:if="${hasNext}">
                            Next <i class="bi bi-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
